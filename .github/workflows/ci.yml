name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install browser test system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg python3-opencv

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run unit and API checks
        run: npm test

      - name: Run Playwright browser checks
        run: npm run test:browser

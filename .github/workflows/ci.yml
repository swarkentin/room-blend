name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit and API checks
        run: npm test

  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # Keep this image version in sync with the Playwright version in package-lock.json.
    # It includes Chromium and all of its Linux system dependencies.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install media and QR test tools
        if: matrix.shard != 3
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Two browser shards install these packages in parallel. Retry transient
          # mirror failures and bound connection stalls so CI cannot hang here.
          apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --yes ffmpeg python3-opencv

      - name: Run Playwright browser shard
        run: npm run test:browser:${{ matrix.shard }}

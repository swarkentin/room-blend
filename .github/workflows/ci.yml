name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit and API checks
        run: npm test

  browser:
    runs-on: ubuntu-latest
    # Keep this image version in sync with the Playwright version in package-lock.json.
    # It includes Chromium and all of its Linux system dependencies.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install media and QR test tools
        run: |
          apt-get update
          apt-get install --yes ffmpeg python3-opencv

      - name: Run Playwright browser checks
        run: npm run test:browser

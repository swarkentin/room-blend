# One-click deploy on Render: New > Blueprint > point at this repo.
#
# Rooms survive restarts and redeploys on the free plan. The host's browser keeps a signed receipt for its room and hands it back
# when the server has forgotten the room (see lib/restore.js), so no database or disk is needed. The one thing the server must keep
# is SESSION_SECRET below, which Render generates once and keeps across restarts and redeploys. Do not delete it: receipts signed
# with the old secret stop working, and hosts would have to start new rooms.
#
# The free plan sleeps after 15 minutes without incoming requests (the host page pings /healthz every 5 minutes while open, which keeps
# it awake). Listeners' picks live in their own browsers, so they are never lost by a restart either.
#
# Optional, paid plans only: also keep the room list on a persistent disk, so a room comes back even for a host on another device.
# Uncomment `disk` and change `plan` to starter. Render disks come with a non-root caveat: if the server logs "save.failed", see docs/SETUP.md.
services:
  - type: web
    name: room-blend
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    # disk:
    #   name: room-blend-data
    #   mountPath: /data
    #   sizeGB: 1
    envVars:
      - key: TRUST_PROXY
        value: "1"
      - key: SESSION_SECRET
        generateValue: true   # signs room restore receipts; generated once by Render and kept across restarts and redeploys
      - key: SPOTIFY_CLIENT_ID
        sync: false   # optional; leave empty and hosts bring their own Spotify app

# One-click deploy on Render: New > Blueprint > point at this repo.
# The free plan sleeps after 15 minutes without incoming requests and has no persistent disk, so a sleep or restart forgets live rooms
# (the host page pings /healthz every 5 minutes while open, which keeps it awake). Fine for testing.
services:
  - type: web
    name: room-blend
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: TRUST_PROXY
        value: "1"
      - key: SPOTIFY_CLIENT_ID
        sync: false   # optional; leave empty and hosts bring their own Spotify app
      - key: STATUS_KEY
        sync: false   # required to open /admin and /status remotely; set a long random secret

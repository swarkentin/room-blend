# One-click deploy on Render: New > Blueprint > point at this repo.
#
# Storage. Render's free plan has no disk and no free Postgres, so use Neon's free Postgres (docs/DATABASE.md, about five minutes):
# create a Neon project, copy its pooled connection string, and paste it as DATABASE_URL when Render asks. With it, rooms and a
# checkpoint of each live room survive restarts and redeploys on the server side, and hosts share which YouTube video answers a song
# lookup and how well videos play (confirmed by several rooms), instead of each browser learning it alone.
#
# Without DATABASE_URL the app still works as before: the host's browser keeps a signed receipt and an encrypted checkpoint for its
# room and hands them back when the server has forgotten the room (see lib/restore.js), and each host's browser keeps its own
# YouTube cache.
#
# Either way the server must keep SESSION_SECRET below, which Render generates once and keeps across restarts and redeploys. Do not
# delete it: receipts and checkpoints made with the old secret stop working, and hosts would have to start new rooms.
#
# The free plan sleeps after 15 minutes without incoming requests (the host page pings /healthz every 5 minutes while open, which keeps
# it awake). Listeners' picks live in their own browsers, so they are never lost by a restart either.
#
# Optional, paid plans only: instead of a database, keep the room list on a persistent disk. Uncomment `disk` and change `plan` to
# starter. Render disks come with a non-root caveat: if the server logs "save.failed", see docs/SETUP.md.
services:
  - type: web
    name: room-blend
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    # disk:
    #   name: room-blend-data
    #   mountPath: /data
    #   sizeGB: 1
    envVars:
      - key: TRUST_PROXY
        value: "1"
      - key: SESSION_SECRET
        generateValue: true   # signs room restore receipts; generated once by Render and kept across restarts and redeploys
      - key: DATABASE_URL
        sync: false   # Neon pooled connection string, e.g. postgresql://user:pass@ep-xxxx-pooler.region.aws.neon.tech/neondb?sslmode=require
      - key: SPOTIFY_CLIENT_ID
        sync: false   # optional; leave empty and hosts bring their own Spotify app
